name: Deploy Islamic Unity to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test REST API and shared calculations
        run: npm test
      - name: Test deployment ordering
        run: node --test tests/deployment.test.mjs
      - name: Validate Android web resources and menu compatibility
        run: npm run test:resources
      - name: Test Quran playback lifecycle
        run: npm run test:quran
      - name: Test Quran video data and safe media mappings
        run: npm run test:video
      - name: Build the site
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Audit internal URLs and complete page destinations
        run: npm run test:urls
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Wait for any legacy Pages publication
        run: node .github/scripts/wait-for-legacy-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
